<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL 合作管理系統</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Noto Sans TC",sans-serif;font-size:13px;background:#f4f2ee;color:#1a1916}
/* header */
.hd{background:#2d4a3e;color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.hd-title{font-size:15px;font-weight:700}
.hd-sub{font-size:12px;opacity:.7}
/* layout */
.layout{display:flex;height:calc(100vh - 52px)}

/* 儀表板 */
#dashboard-wrap{display:none;padding:1.25rem}
#dashboard-wrap.show{display:block}
.kol-card{background:#fff;border:0.5px solid #e2ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.kol-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.kol-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.kol-info{flex:1;margin-left:10px}
.kol-name{font-size:14px;font-weight:500;color:#2d4a3e}
.kol-meta{font-size:11px;color:#7a7670;margin-top:2px}
.dash-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;white-space:nowrap}
.dash-badge.green{background:#eaf3de;color:#27500a}
.dash-badge.amber{background:#faeeda;color:#633806}
.dash-badge.gray{background:#f4f2ee;color:#7a7670;border:0.5px solid #e2ddd5}
.kol-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.kol-stat{background:#f4f2ee;border-radius:8px;padding:8px 10px}
.kol-stat-label{font-size:10px;color:#7a7670;margin-bottom:3px}
.kol-stat-val{font-size:15px;font-weight:500;color:#2d4a3e}
.kol-stat-val.green{color:#27500a}
.kol-stat-val.amber{color:#633806}
.kol-proj-list{border-top:0.5px solid #e2ddd5;padding-top:10px;margin-top:8px}
.kol-proj-label{font-size:10px;color:#7a7670;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.kol-proj-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:0.5px solid #e2ddd5;font-size:12px}
.kol-proj-item:last-child{border-bottom:none}
.kol-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:#7a7670}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.dash-back{display:flex;align-items:center;gap:6px;font-size:13px;color:#2d4a3e;cursor:pointer;padding:6px 12px;border:0.5px solid #e2ddd5;border-radius:8px;background:#fff}
.dash-back:hover{background:#f4f2ee}

/* sidebar */
.sb{width:200px;background:#fff;border-right:1px solid #e2ddd5;padding:12px;overflow-y:auto;flex-shrink:0}
.sb-sec{margin-bottom:16px}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7a7670;margin-bottom:6px}
.fb{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:#1a1916;width:100%;text-align:left}
.fb:hover{background:#f4f2ee}
.fb.on{background:#2d4a3e;color:#fff}
.fb .c{font-size:10px;font-family:monospace;opacity:.7}
/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* toolbar */
.tb{background:#fff;border-bottom:1px solid #e2ddd5;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb input[type=text]{flex:1;min-width:140px;height:34px;border:1px solid #d5d0c8;border-radius:7px;padding:0 10px;background:#f8f7f4;font-size:13px;outline:none}
.tb input[type=text]:focus{border-color:#2d4a3e}
.btn{height:34px;padding:0 12px;border:1px solid #d5d0c8;border-radius:7px;background:#f8f7f4;cursor:pointer;font-size:13px;color:#1a1916;white-space:nowrap}
.btn:hover{background:#eae7e0}
.btn-p{background:#2d4a3e;color:#fff;border-color:#2d4a3e}
.btn-p:hover{background:#1f3329}
.btn-d{background:#fde8e8;color:#8a1a1a;border-color:#f5c5c5;padding:0 8px}
.btn-d:hover{background:#fbd0d0}
.btn-warn{background:#faeeda;color:#633806;border-color:#e8c87a;padding:0 10px}
/* stats */
.stats{background:#fff;border-bottom:1px solid #e2ddd5;padding:7px 14px;display:flex;gap:18px;font-size:12px;color:#7a7670;flex-wrap:wrap}
.stats strong{color:#2d4a3e;font-size:15px;font-weight:700;font-family:monospace}
/* table */
.tbl-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead{position:sticky;top:0;z-index:5;background:#f4f2ee}
th{padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#7a7670;border-bottom:1px solid #e2ddd5;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:#2d4a3e}
td{padding:7px 10px;border-bottom:1px solid #eae7e0;vertical-align:middle;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#faf9f6}
.kol-link{color:#2d4a3e;font-weight:600;text-decoration:none;font-size:12px}
.kol-link:hover{text-decoration:underline}
/* tags */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.t-blue{background:#e6f1fb;color:#0c447c}
.t-pink{background:#fbeaf0;color:#72243e}
.t-green{background:#eaf3de;color:#27500a}
.t-amber{background:#faeeda;color:#633806}
.t-gray{background:#f1efe8;color:#444441}
.t-red{background:#fcebeb;color:#791f1f}
/* inline editable */
.il{border:1px solid transparent;border-radius:5px;background:transparent;font-family:inherit;font-size:12px;color:#1a1916;padding:2px 5px;width:100%}
.il:hover{border-color:#d5d0c8;background:#f8f7f4}
.il:focus{border-color:#2d4a3e;background:#fff;outline:none}
/* modal */
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto;padding:40px 20px}
.modal-wrap.open{display:block}
.modal{background:#fff;border-radius:12px;width:100%;max-width:580px;margin:0 auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid #e2ddd5;display:flex;justify-content:space-between;align-items:center}
.modal-hd h3{font-size:15px;font-weight:500}
.modal-body{padding:18px 22px}
.modal-ft{padding:12px 22px;border-top:1px solid #e2ddd5;display:flex;justify-content:flex-end;gap:8px}
/* form */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;font-weight:700;color:#7a7670;text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{border:1px solid #d5d0c8;border-radius:7px;padding:6px 10px;background:#f8f7f4;font-size:13px;font-family:inherit;height:34px;outline:none}
.fg textarea{height:72px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#2d4a3e}
.eff-title{font-size:11px;font-weight:700;text-transform:uppercase;color:#7a7670;border-top:1px solid #e2ddd5;margin-top:4px;padding-top:14px;margin-bottom:10px}
/* detail */
.d-sec{font-size:11px;font-weight:700;color:#7a7670;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #eae7e0;text-transform:uppercase}
.d-row{display:flex;gap:10px;margin-bottom:8px;font-size:13px}
.d-key{color:#7a7670;width:90px;flex-shrink:0}
.d-val{flex:1;word-break:break-all;white-space:pre-wrap;line-height:1.5}
.pbox{background:#f8f7f4;border-radius:7px;padding:10px;font-family:monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto}
.eff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.eff-card{background:#f8f7f4;border-radius:8px;padding:10px;text-align:center}
.eff-num{font-family:monospace;font-size:20px;font-weight:700;color:#2d4a3e}
.eff-lbl{font-size:11px;color:#7a7670;margin-top:3px}
/* empty */
.empty{text-align:center;padding:60px;color:#7a7670}
/* sync banner */
#sync-banner{position:fixed;bottom:16px;right:16px;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:999;box-shadow:0 2px 12px rgba(0,0,0,.15);cursor:pointer;opacity:0;transition:opacity .4s;pointer-events:none}
#sync-banner.show{opacity:1;pointer-events:auto}

/* 儀表板 */
#dashboard-wrap{display:none;padding:1.25rem;overflow-y:auto;flex:1;flex-direction:column}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.dash-back{display:flex;align-items:center;gap:6px;font-size:13px;color:#2d4a3e;cursor:pointer;padding:6px 12px;border:0.5px solid #e2ddd5;border-radius:8px;background:#fff;border-width:1px}
.dash-back:hover{background:#f4f2ee}
.kol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.kol-card{background:#fff;border:0.5px solid #e2ddd5;border-radius:12px;padding:1rem 1.25rem}
.kol-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
.kol-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.kol-info{flex:1;min-width:0}
.kol-cname{font-size:13px;font-weight:500;color:#2d4a3e;display:flex;align-items:center;gap:4px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kol-meta{font-size:11px;color:#7a7670;margin-top:2px}
.dash-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-rec{background:#eaf3de;color:#27500a}
.badge-cau{background:#faeeda;color:#633806}
.badge-neu{background:#f4f2ee;color:#7a7670;border:0.5px solid #e2ddd5}
.kol-stats-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.kol-stats-g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.kol-stat{background:#f4f2ee;border-radius:7px;padding:7px 9px}
.kol-stat-lbl{font-size:10px;color:#7a7670;margin-bottom:2px}
.kol-stat-val{font-size:14px;font-weight:500;color:#2d4a3e}
.kol-stat-val.sv-green{color:#27500a}
.kol-stat-val.sv-amber{color:#633806}
.kol-proj-wrap{border-top:0.5px solid #e2ddd5;padding-top:8px;margin-top:8px}
.kol-proj-lbl{font-size:9px;color:#7a7670;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.kol-proj-item{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:0.5px solid #f4f2ee;font-size:11px;color:#1a1916}
.kol-proj-item:last-child{border-bottom:none}
.kol-proj-topic{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.kol-proj-date{color:#7a7670;font-size:10px;margin-right:6px;flex-shrink:0}
.kol-footer{margin-top:8px;font-size:10px;color:#7a7670;display:flex;align-items:center;gap:4px}



/* 排序圖示 */
th[data-sort]{cursor:pointer;user-select:none}
.sort-icon{color:#ccc;font-size:11px;margin-left:4px}

/* 登入畫面 */
#login-screen{position:fixed;inset:0;background:#f4f2ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999}
#login-screen h1{font-size:22px;font-weight:700;color:#2d4a3e}
#login-screen p{font-size:13px;color:#7a7670}
.btn-google{display:flex;align-items:center;gap:10px;padding:12px 24px;background:#fff;border:1px solid #d5d0c8;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-google:hover{background:#f8f7f4}
.btn-google img{width:20px;height:20px}
#user-bar{display:flex;align-items:center;gap:10px;font-size:12px;margin-left:auto}
#user-name{color:rgba(255,255,255,.8)}
.btn-logout{height:26px;padding:0 10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:5px;color:#fff;font-size:11px;cursor:pointer}
.btn-logout:hover{background:rgba(255,255,255,.25)}

/* 載入畫面 */
#loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px;color:#2d4a3e;font-weight:500}
#loading-overlay.hide{display:none}
.spinner{width:32px;height:32px;border:3px solid #e2ddd5;border-top-color:#2d4a3e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 燈箱 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center;cursor:zoom-out;overflow:hidden}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);transition:transform .1s;user-select:none}
#lightbox-close{position:fixed;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;line-height:1;opacity:.8;z-index:10000}
#lightbox-close:hover{opacity:1}
#lightbox-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:12px;z-index:10000;pointer-events:none}
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login-screen">
  <h1>✦ KOL 合作管理系統</h1>
  <p>請使用公司 Google 帳號登入</p>
  <button class="btn-google" id="btn-login">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    使用 Google 帳號登入
  </button>
</div>

<!-- 主系統 -->
<div id="app" style="display:none">
<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img" src="" alt="GA4 截圖放大">
  <div id="lightbox-hint">滾輪縮放 ｜ 拖曳移動 ｜ 雙擊重置 ｜ Esc 關閉</div>
</div>
<div id="loading-overlay"><div class="spinner"></div><span>正在連線資料庫，載入最新資料…</span></div>
<div id="sync-banner"></div>

<div class="hd" style="display:flex;align-items:center">
  <span class="hd-title">✦ KOL 合作管理系統</span>
  <span class="hd-sub" id="hd-date"></span>
  <div id="user-bar"><span id="user-name"></span><button class="btn-logout" id="btn-logout">登出</button></div>
</div>

<div class="layout">
  <aside class="sb">
    <div class="sb-sec">
      <button id="btn-dashboard" style="width:100%;padding:8px 10px;background:#2d4a3e;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:4px">
        📊 摘要儀表板
      </button>
    </div>
    <div class="sb-sec"><div class="sb-lbl">狀態</div><div id="sb-status"></div></div>
    <div class="sb-sec"><div class="sb-lbl">合作形式</div><div id="sb-type"></div></div>
    <div class="sb-sec"><div class="sb-lbl">費用</div><div id="sb-pay"></div></div>
    <div class="sb-sec"><div class="sb-lbl">負責人</div><div id="sb-owner"></div></div>
    <div class="sb-sec"><div class="sb-lbl">廣告授權</div><div id="sb-ad"></div></div>
  </aside>

  <div class="main">
    <div id="dashboard-wrap">
  <div class="dash-header">
    <div>
      <div style="font-size:15px;font-weight:500;color:#2d4a3e">摘要儀表板</div>
      <div style="font-size:12px;color:#7a7670" id="dash-subtitle"></div>
    </div>
    <button class="dash-back" id="btn-dash-back">← 返回列表</button>
  </div>
  <div class="kol-grid" id="dash-grid"></div>
</div>
    <div class="tb">
      <input type="text" id="search" placeholder="搜尋 KOL、主題、負責人...">
      <button class="btn btn-warn" id="btn-reset">✕ 清除篩選</button>
      <div style="display:flex;border:1px solid #d5d0c8;border-radius:7px;overflow:hidden">
        <button class="btn time-btn on" data-p="all" style="border:none;border-radius:0;height:34px;padding:0 10px;font-size:12px">全部</button>
        <button class="btn time-btn" data-p="week" style="border:none;border-left:1px solid #d5d0c8;border-radius:0;height:34px;padding:0 10px;font-size:12px">本週</button>
        <button class="btn time-btn" data-p="month" style="border:none;border-left:1px solid #d5d0c8;border-radius:0;height:34px;padding:0 10px;font-size:12px">本月</button>
        <button class="btn time-btn" data-p="custom" style="border:none;border-left:1px solid #d5d0c8;border-radius:0;height:34px;padding:0 10px;font-size:12px">自訂</button>
      </div>
      <div id="custom-range" style="display:none;align-items:center;gap:6px;font-size:12px;color:#7a7670">
        <input type="date" id="range-from" style="height:34px;border:1px solid #d5d0c8;border-radius:7px;padding:0 8px;font-size:12px;background:#f8f7f4">
        <span>～</span>
        <input type="date" id="range-to" style="height:34px;border:1px solid #d5d0c8;border-radius:7px;padding:0 8px;font-size:12px;background:#f8f7f4">
      </div>
      <button class="btn" id="btn-export">💾 匯出</button>
      <input type="file" id="file-import" accept=".json" style="display:none">
      <button class="btn" id="btn-import">📂 匯入</button>
      <div style="position:relative" id="sync-wrap">
        <button class="btn" id="btn-sync">🔄 同步 ▾</button>
        <div id="sync-menu" style="display:none;position:absolute;top:38px;right:0;background:#fff;border:1px solid #d5d0c8;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:180px;z-index:99;padding:4px 0">
          <div class="sync-opt" data-act="pull" style="padding:9px 14px;cursor:pointer;font-size:13px">⬇️ 從 Sheets 拉取</div>
          <div class="sync-opt" data-act="push" style="padding:9px 14px;cursor:pointer;font-size:13px;border-top:1px solid #f0ece5">⬆️ 推送到 Sheets</div>
        </div>
      </div>
      <button class="btn btn-p" id="btn-add">+ 新增合作</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tbl-wrap">
      
<table id="main-table">
        <thead><tr id="thead-row">
          <th>KOL 帳號</th>
          <th>形式</th>
          <th>粉絲數</th>
          <th>主題</th>
          <th>費用</th>
          <th>廣告授權</th>
          <th>狀態</th>
          <th data-sort="date">合作日期 <span class="sort-icon" data-col="date">⇅</span></th>
          <th>合作內容</th>
          <th data-sort="quote" style="text-align:right">合作費用 <span class="sort-icon" data-col="quote">⇅</span></th>
          <th data-sort="revenue" style="text-align:right">銷售收益 <span class="sort-icon" data-col="revenue">⇅</span></th>
          <th data-sort="roi" style="text-align:right">ROI <span class="sort-icon" data-col="roi">⇅</span></th>
          <th style="text-align:center;width:60px;white-space:nowrap">有效推廣</th>
          <th style="text-align:center;width:60px;white-space:nowrap">帶動收益</th>
          <th style="width:80px">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">找不到符合條件的資料</div>
    </div>
  </div>
</div>

<!-- Form Modal -->
<div class="modal-wrap" id="form-wrap">
  <div class="modal">
    <div class="modal-hd">
      <h3 id="form-title">新增合作</h3>
      <button class="btn" id="close-form">✕</button>

// ── Banner ──
function banner(msg, ok=true){
  const el=document.getElementById('sync-banner');
  el.textContent=msg;
  el.style.background=ok?'#eaf3de':'#faeeda';
  el.style.color=ok?'#27500a':'#633806';
  el.style.border='1px solid '+(ok?'#b8d99a':'#e8c87a');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4000);
}

function hideOverlay(){
  const el=document.getElementById('loading-overlay');
  if(el) el.classList.add('hide');
}


// ── 從 quote 欄位安全取出第一個數字 ──
function extractCost(q){
  if(!q && q!==0) return 0;
  const m = String(q).match(/\d[\d,]*/);
  if(!m) return 0;
  const n = parseInt(m[0].replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}
function fmtCost(q){
  if(!q&&q!==0) return '—';
  const n = extractCost(q);
  return n>0 ? '$'+n.toLocaleString() : String(q).slice(0,12);
}
function roiBadge(d){
  if(d.revenue==null) return '<span style="color:#ccc">—</span>';
  const cost = extractCost(d.quote);
  if(!cost) return d.revenue>0?'<span style="color:#27500a;font-weight:500">$'+d.revenue.toLocaleString()+'</span>':'<span style="color:#ccc">—</span>';
  const roi=(d.revenue/cost).toFixed(1);
  const col=roi>=3?'#27500a':roi>=1?'#2d4a3e':'#8a1a1a';
  return '<span style="color:'+col+';font-weight:500">'+roi+'x</span>';
}


// ── Firebase 即時監聽 ──
function startRealtimeSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); }
  const colRef = collection(db, COL);
  unsubscribeSnapshot = onSnapshot(colRef, (snapshot) => {
    if(snapshot.empty){ uploadSeed(); return; }
    data = snapshot.docs.map(d => d.data());
    data.sort((a,b)=>(b.id||0)-(a.id||0));
    nextId = Math.max(...data.map(d=>d.id||0), 0) + 1;
    hideOverlay();
    buildSidebar();
    render();
  }, (err) => {
    banner('連線失敗：'+err.message, false);
    hideOverlay();
  });
}

async function uploadSeed(){
  banner('首次使用，上傳初始資料中…');
  for(const row of SEED){
    await setDoc(doc(db, COL, String(row.id)), row);
  }
  banner('✓ 初始資料上傳完成');
}

async function saveRowToFirebase(row){
  try{
    await setDoc(doc(db, COL, String(row.id)), row);
    banner('✓ 已同步至資料庫');
  }catch(e){ banner('⚠ 同步失敗：'+e.message, false); }
}

async function delRowFromFirebase(id){
  try{
    await deleteDoc(doc(db, COL, String(id)));
    banner('✓ 已刪除');
  }catch(e){ banner('⚠ 刪除失敗：'+e.message, false); }
}

// ── 登入登出 ──
async function login(){
  try{
    provider.setCustomParameters({prompt:'select_account'});
    const result = await signInWithPopup(auth, provider);
    if(result && result.user){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('user-name').textContent = result.user.displayName||result.user.email;
      if(!syncStarted){ syncStarted=true; startRealtimeSync(); }
    }
  }catch(e){
    if(e.code==='auth/popup-blocked'){
      banner('請允許瀏覽器彈出視窗，或改用其他瀏覽器', false);
    } else if(e.code!=='auth/cancelled-popup-request' && e.code!=='auth/popup-closed-by-user'){
      banner('登入失敗：'+e.message, false);
    }
  }
}

async function logout(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
  syncStarted = false;
  await signOut(auth);
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

// ── 監聽登入狀態 ──
onAuthStateChanged(auth, async (user)=>{
  if(user){
    // 檢查 Firebase admins 白名單
    try{
      const adminDoc = await getDoc(doc(db, 'admins', user.email));
      if(adminDoc.exists() && adminDoc.data().allowed === true){
        // 在白名單內，允許登入
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app').style.display='block';
        document.getElementById('user-name').textContent = user.displayName||user.email;
        if(!syncStarted){ syncStarted=true; startRealtimeSync(); }
      } else {
        // 不在白名單，強制登出
        await signOut(auth);
        document.getElementById('login-screen').style.display='flex';
        document.getElementById('app').style.display='none';
        hideOverlay();
        alert('此帳號（'+user.email+'）無權限存取，請聯絡管理員。');
      }
    } catch(e){
      console.error('白名單驗證失敗：', e);
      await signOut(auth);
      document.getElementById('login-screen').style.display='flex';
      document.getElementById('app').style.display='none';
      hideOverlay();
      alert('驗證失敗，請稍後再試。');
    }
  } else {
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').style.display='none';
    hideOverlay();
  }
});

  return s?`<span class="tag ${m[s]||'t-gray'}">${s}</span>`:'';

function postIcon(u){
  if(!u) return '';
  if(u.includes('instagram')) return '📷';
  if(u.includes('youtube')||u.includes('youtu.be')) return '▶️';
  if(u.includes('tiktok')) return '🎵';
  if(u.includes('threads')) return '🧵';
  return '🔗';
}
function fmtDate(s){
  if(!s) return '—';
  try{ const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}); }catch(e){ return s; }
}
function normDate(s){
  if(!s) return '';
  try{ const d=new Date(s); return isNaN(d.getTime())?String(s).slice(0,10):d.toISOString().slice(0,10); }catch(e){ return ''; }
}

// ── Filtering ──
function getFiltered(){
  return data.filter(d=>{
    if(flt.status && d.status!==flt.status) return false;
    if(flt.type   && d.type!==flt.type)     return false;
    if(flt.pay    && d.pay!==flt.pay)        return false;
    if(flt.owner  && d.owner!==flt.owner)    return false;
    if(flt.ad==='yes' && !d.adAuth)  return false;
    if(flt.ad==='no'  &&  d.adAuth)  return false;
    if(search){
      const q=search.toLowerCase();
      if(![d.kol,d.topic,d.owner,d.orderNo,d.products].some(s=>String(s||'').toLowerCase().includes(q))) return false;
    }
    if(d.date && period!=='all'){
      const dt=new Date(d.date), now=new Date();
      if(period==='week'){
        const s=new Date(now); s.setDate(now.getDate()-now.getDay()+1); s.setHours(0,0,0,0);
        const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999);
        if(dt<s||dt>e) return false;
      } else if(period==='month'){
        if(dt.getFullYear()!==now.getFullYear()||dt.getMonth()!==now.getMonth()) return false;
      } else if(period==='custom'){
        if(rangeFrom && dt<new Date(rangeFrom)) return false;
        if(rangeTo   && dt>new Date(rangeTo+'T23:59:59')) return false;
      }
    }
    return true;
  });
}

// ── Sidebar ──
function buildSidebar(){
  function grp(id, key, opts){
    const cnt={};
    data.forEach(d=>{ const v=d[key]||''; cnt[v]=(cnt[v]||0)+1; });
    const cur=flt[key]||'';
    document.getElementById(id).innerHTML=
      `<button class="fb ${cur===''?'on':''}" data-key="${key}" data-val="">全部 <span class="c">${data.length}</span></button>`+
      opts.map(v=>`<button class="fb ${cur===v?'on':''}" data-key="${key}" data-val="${v}">${v} <span class="c">${cnt[v]||0}</span></button>`).join('');
  }
  grp('sb-status','status',['備選中','KOL洽談中','KOL拍攝中','等待商品寄出','已結案']);
  grp('sb-type','type',['圖文合作','REELS短片','Threads','YT影片','限動合作','抽獎合作']);
  grp('sb-pay','pay',['互惠','收費']);
  const owners=[...new Set(data.map(d=>d.owner).filter(Boolean))].sort();
  const ocnt={}; data.forEach(d=>{ if(d.owner) ocnt[d.owner]=(ocnt[d.owner]||0)+1; });
  const curO=flt.owner||'';
  document.getElementById('sb-owner').innerHTML=
    `<button class="fb ${curO===''?'on':''}" data-key="owner" data-val="">全部 <span class="c">${data.length}</span></button>`+
    owners.map(v=>`<button class="fb ${curO===v?'on':''}" data-key="owner" data-val="${v}">${v} <span class="c">${ocnt[v]||0}</span></button>`).join('');
  const curAd=flt.ad||'';
  document.getElementById('sb-ad').innerHTML=
    `<button class="fb ${curAd===''?'on':''}" data-key="ad" data-val="">全部</button>`+
    `<button class="fb ${curAd==='yes'?'on':''}" data-key="ad" data-val="yes">有授權 <span class="c">${data.filter(d=>d.adAuth).length}</span></button>`+
    `<button class="fb ${curAd==='no'?'on':''}" data-key="ad" data-val="no">無授權 <span class="c">${data.filter(d=>!d.adAuth).length}</span></button>`;

  document.querySelectorAll('.fb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.dataset.key, val=btn.dataset.val;
      if(key==='ad') flt.ad=val; else flt[key]=val;
      document.querySelectorAll(`.fb[data-key="${key}"]`).forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      render();
    });
  });
}

// ── Render table ──
function render(){
  const filtered = getFiltered();

  // 排序
  const rows = [...filtered].sort((a,b)=>{
    let av, bv;
    if(sortKey==='date'){
      av = a.date ? new Date(a.date).getTime() : 0;
      bv = b.date ? new Date(b.date).getTime() : 0;
    } else if(sortKey==='quote'){
      av = extractCost(a.quote);
      bv = extractCost(b.quote);
    } else if(sortKey==='revenue'){
      av = Number(a.revenue)||0;
      bv = Number(b.revenue)||0;
    } else if(sortKey==='roi'){
      const ca=extractCost(a.quote), cb=extractCost(b.quote);
      av = ca>0?(Number(a.revenue)||0)/ca:(Number(a.revenue)||0)>0?999:0;
      bv = cb>0?(Number(b.revenue)||0)/cb:(Number(b.revenue)||0)>0?999:0;
    } else {
      av = a.id||0; bv = b.id||0;
    }
    return sortAsc ? av-bv : bv-av;
  });

  // 更新三角形圖示
  document.querySelectorAll('.sort-icon').forEach(el=>{
    const col=el.dataset.col;
    if(col===sortKey){ el.textContent=sortAsc?'▲':'▼'; el.style.color='#2d4a3e'; }
    else{ el.textContent='⇅'; el.style.color='#ccc'; }
  });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');

  // Stats
  const totalCost = rows.reduce((s,d)=>s+(d.pay==='收費'? extractCost(d.quote) :0),0);
  const totalRev  = rows.reduce((s,d)=>s+(Number(d.revenue)||0),0);
  const roi = totalCost>0?(totalRev/totalCost).toFixed(2)+'x':'—';
  document.getElementById('stats').innerHTML=
    `<span>顯示 <strong>${rows.length}</strong> 筆</span>`+
    `<span>付費 <strong>${rows.filter(d=>d.pay==='收費').length}</strong> 筆</span>`+
    `<span>總費用 <strong style="color:#633806">${totalCost>0?'$'+totalCost.toLocaleString():'—'}</strong></span>`+
    `<span>總收益 <strong style="color:#27500a">${totalRev>0?'$'+totalRev.toLocaleString():'—'}</strong></span>`+
    `<span>整體ROI <strong style="color:#2d4a3e">${roi}</strong></span>`+
    `<span>廣告授權 <strong>${rows.filter(d=>d.adAuth).length}</strong></span>`+
    `<span>REELS <strong>${rows.filter(d=>d.type==='REELS短片').length}</strong></span>`;

  if(!rows.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  tbody.innerHTML = rows.map((d,i)=>{
    const nd = normDate(d.date);
    return `<tr>
      <td><a class="kol-link" href="https://www.instagram.com/${d.kol}/" target="_blank">@${d.kol}</a></td>
      <td>${typeTag(d.type)}</td>
      <td style="font-size:11px;color:#7a7670;font-family:monospace">${d.fans||'—'}</td>
      <td style="color:#7a7670">${d.topic||'—'}</td>
      <td>${payTag(d.pay)}</td>
      <td>${adTag(d.adAuth)}</td>
      <td>
        <select class="il" style="font-size:12px" data-idx="${i}">
          ${['KOL洽談中','KOL拍攝中','等待商品寄出','已結案'].map(v=>`<option ${d.status===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </td>
      <td style="font-size:11px;color:#7a7670;font-family:monospace">${nd||'—'}</td>
      <td style="text-align:center">${d.postLink?`<a href="${d.postLink}" target="_blank" style="color:#2d4a3e;text-decoration:none;font-size:12px;background:#eaf3de;border-radius:5px;padding:2px 8px">${postIcon(d.postLink)} 查看</a>`:'<span style="color:#ddd">—</span>'}</td>
      <td style="text-align:right;font-family:monospace;font-size:12px">${d.quote?'<span style="color:#633806">'+fmtCost(d.quote)+'</span>':'<span style="color:#ccc">—</span>'}</td>
      <td style="text-align:right;font-family:monospace;font-size:12px">${d.revenue!=null?'<span style="color:#27500a;font-weight:500">$'+Number(d.revenue).toLocaleString()+'</span>':'<span style="color:#ccc">—</span>'}</td>
      <td style="text-align:right">${roiBadge(d)}</td>
      <td style="text-align:center;width:60px;font-size:16px">${d.effCheck===true?'✅':d.effCheck===false?'❌':'—'}</td>
      <td style="text-align:center;width:60px;font-size:16px">${d.drvRevenue===true?'💰':d.drvRevenue===false?'❌':'—'}</td>
      <td style="display:flex;gap:4px;align-items:center">
        <button class="btn" style="height:26px;padding:0 8px;font-size:14px" data-idx="${i}" data-act="detail">🔍</button>
        <button class="btn" style="height:26px;padding:0 8px;font-size:11px" data-idx="${i}" data-act="edit">編輯</button>
        <button class="btn btn-d" style="height:26px;padding:0 8px;font-size:11px" data-idx="${i}" data-act="del">刪除</button>
      </td>
    </tr>`;
  }).join('');

  // Status inline change
  tbody.querySelectorAll('select[data-idx]').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const row = rows[parseInt(sel.dataset.idx)];
      if(row){ row.status=sel.value; saveRowToFirebase(row); buildSidebar(); }
    });
  });

  // Action buttons - use data-idx to get the exact row object
  tbody.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row = rows[parseInt(btn.dataset.idx)];
      if(!row) return;
      const act = btn.dataset.act;
      if(act==='detail') openDetail(row);
      else if(act==='edit') openEditForm(row);
      else if(act==='del'){
        if(confirm('確定要刪除 @'+row.kol+' 嗎？')){
          data = data.filter(d=>d!==row);
           delRowFromFirebase(row.id);
          buildSidebar(); render();
        }
      }
    });
  });
}

function num(id){ const v=document.getElementById(id).value; return v?parseInt(v):null; }

function saveForm(){
  const kol = document.getElementById('f-kol').value.trim();
  if(!kol){ alert('請填入 KOL 帳號'); return; }

  const vals = {
    kol:      kol.replace('@',''),
    type:     document.getElementById('f-type').value,
    fans:     document.getElementById('f-fans').value,
    pay:      document.getElementById('f-pay').value,
    topic:    document.getElementById('f-topic').value,
    owner:    document.getElementById('f-owner').value,
    quote:    document.getElementById('f-quote').value,
    adAuth:   document.getElementById('f-adAuth').value==='1',
    adPartner:false,
    adCode:   document.getElementById('f-adcode').value||'',
    status:   document.getElementById('f-status').value,
    products: document.getElementById('f-products').value,
    postLink: document.getElementById('f-postlink').value||null,
    ga4url: document.getElementById('f-ga4').dataset.url||null,
    effCheck: document.getElementById('f-effcheck').value==='null'?null:document.getElementById('f-effcheck').value==='true',
    drvRevenue: document.getElementById('f-drvrevenue').value==='null'?null:document.getElementById('f-drvrevenue').value==='true',
    link:     document.getElementById('f-link').value,
    orderNo:  document.getElementById('f-order').value,
    address:  document.getElementById('f-address').value,
    date:     document.getElementById('f-date').value||null,
    reach:    num('f-reach'), engage: num('f-engage'), clicks: num('f-clicks'),
    newfans:  num('f-newfans'), units: num('f-units'), revenue: num('f-revenue'),
    effnote:  document.getElementById('f-effnote').value,
    branch:   '',
  };

  if(editingRow){
    // Update in place - mutate the existing object
    Object.assign(editingRow, vals);
    saveRowToFirebase(editingRow);
  } else {
    const newRow = { id: nextId++, ...vals };
    data.unshift(newRow);
    saveRowToFirebase(newRow);
  }
  
  closeForm();
  buildSidebar();
  render();
}

document.getElementById('btn-export').addEventListener('click',()=>{

  a.href=URL.createObjectURL(blob);
  a.download='KOL備份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  banner('✓ 已匯出 '+data.length+' 筆');
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(!Array.isArray(imp)) throw new Error('格式錯誤');
      if(!confirm('確定匯入 '+imp.length+' 筆？這會取代目前資料。')) return;
      data=imp;  buildSidebar(); render();
      banner('✓ 已匯入 '+data.length+' 筆');
    }catch(err){ alert('匯入失敗：'+err.message); }
    e.target.value='';
  };
  r.readAsText(f);
});

function renderDashboard(){
  const kolMap = {};
  data.filter(d=>d.kol&&d.kol.trim()&&!d.kol.includes('預計')).forEach(d=>{
    const key = d.kol.replace('@','').toLowerCase().trim();
    if(!kolMap[key]) kolMap[key] = {kol:d.kol, type:d.type, fans:d.fans, records:[]};
    kolMap[key].records.push(d);
  });

  const kols = Object.values(kolMap).sort((a,b)=>b.records.length-a.records.length);
  document.getElementById('dash-subtitle').textContent = '共 '+kols.length+' 位 KOL／KOC，依合作次數排列';

  const colors = [
    ['#eaf3de','#27500a'],['#EEEDFE','#3C3489'],['#faeeda','#633806'],
    ['#FAECE7','#712B13'],['#E1F5EE','#085041'],['#e6f1fb','#0c447c']
  ];

  const grid = document.getElementById('dash-grid');
  grid.innerHTML = kols.map((k,ki)=>{
    const recs = k.records.sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);
    const total = recs.length;
    const effCount = recs.filter(r=>r.effCheck===true).length;
    const effTotal = recs.filter(r=>r.effCheck!==null&&r.effCheck!==undefined).length;
    const drvCount = recs.filter(r=>r.drvRevenue===true).length;
    const effRate = effTotal>0 ? Math.round(effCount/effTotal*100) : 0;
    const isPaid = recs.some(r=>r.pay==='收費');
    const totalCost = recs.reduce((s,r)=>s+extractCost(r.quote),0);
    const totalRev = recs.reduce((s,r)=>s+(Number(r.revenue)||0),0);
    const totalReach = recs.reduce((s,r)=>s+(Number(r.reach)||0),0);
    const totalEngage = recs.reduce((s,r)=>s+(Number(r.engage)||0),0);
    const engageRate = totalReach>0 ? (totalEngage/totalReach*100).toFixed(1) : null;
    const roi = totalCost>0 ? (totalRev/totalCost).toFixed(1)+'x' : null;
    const lastDate = recs[0]?.date ? recs[0].date.slice(0,7) : null;
    const hasAnyEff = recs.some(r=>r.effCheck!==undefined && r.effCheck!==null);
    const recommend = effRate>=50;
    const initials = k.kol.replace('@','').slice(0,2).toUpperCase();
    const [bg,fg] = colors[ki % colors.length];

    const recentProjs = recs.slice(0,3).map(r=>`
      <div class="kol-proj-item">
        <span class="kol-proj-topic">${r.topic||'—'}</span>
        <span class="kol-proj-date">${r.date?r.date.slice(0,7):''}</span>
        <span>${r.effCheck===true?'✅':r.effCheck===false?'❌':'—'}</span>
      </div>`).join('');

    const badgeCls = hasAnyEff ? (recommend?'badge-rec':'badge-cau') : 'badge-neu';
    const badgeText = hasAnyEff ? (recommend?'⭐ 推薦再合作':'⚠ 謹慎評估') : '待評估';

    const paidSection = isPaid ? `
      <div class="kol-stats-g2">
        <div class="kol-stat"><div class="kol-stat-lbl">總費用</div><div class="kol-stat-val">$${totalCost.toLocaleString()}</div></div>
        <div class="kol-stat"><div class="kol-stat-lbl">總收益</div><div class="kol-stat-val sv-green">${totalRev>0?'$'+totalRev.toLocaleString():'—'}</div></div>
      </div>
      ${roi?`<div class="kol-stat" style="margin-bottom:6px"><div class="kol-stat-lbl">整體 ROI</div><div class="kol-stat-val sv-green">${roi}</div></div>`:''}
    ` : `
      <div class="kol-stats-g" style="margin-bottom:6px">
        <div class="kol-stat"><div class="kol-stat-lbl">總觸及</div><div class="kol-stat-val">${totalReach>0?totalReach.toLocaleString():'—'}</div></div>
        <div class="kol-stat"><div class="kol-stat-lbl">總互動</div><div class="kol-stat-val">${totalEngage>0?totalEngage.toLocaleString():'—'}</div></div>
        <div class="kol-stat"><div class="kol-stat-lbl">互動率</div><div class="kol-stat-val sv-green">${engageRate?engageRate+'%':'—'}</div></div>
      </div>

// ── GA4 截圖上傳（Base64，不需要 Storage）──
document.getElementById('f-ga4').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  // 檢查檔案大小（限制 800KB）
  if(file.size > 800 * 1024){
    banner('⚠ 圖片太大，請壓縮至 800KB 以下', false);
    return;
  }

  const uploading = document.getElementById('ga4-uploading');
  const label = document.getElementById('ga4-upload-label');
  uploading.style.display='block';
  label.style.opacity='0.5';

  try{
    // 讀取圖片並轉成 Base64
    const base64 = await new Promise((res, rej)=>{
      const reader = new FileReader();
      reader.onload = ()=> res(reader.result);
      reader.onerror = ()=> rej(new Error('讀取失敗'));
      reader.readAsDataURL(file);
    });

    // 壓縮圖片
    const compressed = await compressImage(base64, 800, 0.7);
    e.target.dataset.url = compressed;
    document.getElementById('ga4-img').src = compressed;
    document.getElementById('ga4-preview').style.display='block';
    document.getElementById('ga4-upload-text').textContent='重新上傳截圖';
    banner('✓ GA4 截圖已載入');
  }catch(err){
    banner('⚠ 截圖載入失敗：'+err.message, false);
    console.error('ga4 error:', err);
  }finally{
    uploading.style.display='none';
    label.style.opacity='1';
  }
});

// ── 圖片壓縮函式 ──
function compressImage(base64, maxWidth, quality){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      res(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = base64;
  });
}

// ── 燈箱放大圖片（支援縮放和拖曳）──
let lbScale = 1, lbDragging = false, lbStartX = 0, lbStartY = 0, lbTransX = 0, lbTransY = 0;

function openLightbox(src){
  lbScale = 1; lbTransX = 0; lbTransY = 0;
  const img = document.getElementById('lightbox-img');
  img.src = src;
  img.style.transform = 'scale(1) translate(0,0)';
  img.style.cursor = 'grab';
  document.getElementById('lightbox').classList.add('show');
  document.addEventListener('keydown', closeLightboxOnEsc);
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
  document.removeEventListener('keydown', closeLightboxOnEsc);
}

function closeLightboxOnEsc(e){ if(e.key==='Escape') closeLightbox(); }

function updateLbTransform(){
  const img = document.getElementById('lightbox-img');
  img.style.transform = `scale(${lbScale}) translate(${lbTransX/lbScale}px,${lbTransY/lbScale}px)`;
}

// 滾輪縮放
document.getElementById('lightbox').addEventListener('wheel', (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.15 : 0.15;
  lbScale = Math.min(Math.max(lbScale + delta, 0.5), 5);
  updateLbTransform();
  document.getElementById('lightbox-img').style.cursor = lbScale > 1 ? 'grab' : 'grab';
}, { passive: false });

// 拖曳移動
document.getElementById('lightbox-img').addEventListener('mousedown', (e)=>{
  if(lbScale <= 1) return;
  lbDragging = true;
  lbStartX = e.clientX - lbTransX;
  lbStartY = e.clientY - lbTransY;
  e.target.style.cursor = 'grabbing';
  e.stopPropagation();
});

document.addEventListener('mousemove', (e)=>{
  if(!lbDragging) return;
  lbTransX = e.clientX - lbStartX;
  lbTransY = e.clientY - lbStartY;
  updateLbTransform();
});

document.addEventListener('mouseup', ()=>{
  if(lbDragging){
    lbDragging = false;
    document.getElementById('lightbox-img').style.cursor = 'grab';
  }
});

// 雙擊重置
document.getElementById('lightbox-img').addEventListener('dblclick', (e)=>{
  lbScale = 1; lbTransX = 0; lbTransY = 0;
  updateLbTransform();
  e.stopPropagation();
});
